name: Refresh ecosystem report

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: report-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run offline tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Pull public data and generate artifacts
        run: python collector/solana_signal.py --publish-web-snapshot
      - name: Commit changed report
        run: |
          git config user.name "solana-signal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data/latest.json reports/latest.json reports/latest.md
          git diff --cached --quiet || git commit -m "data: refresh ecosystem snapshot"
          git push
